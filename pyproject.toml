[project]
name = "helia-model-zoo"
version = "0.1.0"
description = "Model artifacts, golden fixtures and their manifest for Ambiq's helia tools."
authors = [{ name = "Ambiq AI", email = "support.aitg@ambiq.com" }]
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
litert = ["ai-edge-litert>=2.1.2"]

[project.scripts]
helia-zoo = "helia_model_zoo.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/helia_model_zoo"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "LICENSE", "NOTICE", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-include = ["tools/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
