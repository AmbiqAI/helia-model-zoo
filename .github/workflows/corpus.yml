name: Corpus integrity

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout and hydrate Git LFS
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install pinned validator runtime
        run: python -m pip install --disable-pip-version-check -r tools/golden-requirements.txt
      - name: Validate corpus manifest
        run: python tools/validate_corpus.py corpus-manifest-v1.json
